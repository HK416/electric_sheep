[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HK416/electric_sheep"

[workspace.dependencies]
es-math = { path = "crates/es-math" }
es-core = { path = "crates/es-core" }
es-ir = { path = "crates/es-ir" }
es-assets = { path = "crates/es-assets" }
es-telemetry = { path = "crates/es-telemetry" }
es-physics-core = { path = "crates/es-physics-core" }
es-physics-backend = { path = "crates/es-physics-backend" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
blake3 = "1"
thiserror = "2"
proptest = "1"
wide = "0.7"
crossbeam = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Determinism (spec 3.4): iteration order of HashMap is non-deterministic.
disallowed_types = "warn"

[profile.release]
debug = 1

[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HK416/electric_sheep"

[workspace.dependencies]
es-math = { path = "crates/es-math" }
es-core = { path = "crates/es-core" }
es-ir = { path = "crates/es-ir" }
es-ir-types = { path = "crates/es-ir-types" }
es-assets = { path = "crates/es-assets" }
es-telemetry = { path = "crates/es-telemetry" }
es-physics-core = { path = "crates/es-physics-core" }
es-physics-backend = { path = "crates/es-physics-backend" }
es-data = { path = "crates/es-data" }
es-policy = { path = "crates/es-policy" }
es-actuator = { path = "crates/es-actuator" }
es-sensor = { path = "crates/es-sensor" }
es-env = { path = "crates/es-env" }
es-safety = { path = "crates/es-safety" }
es-compile = { path = "crates/es-compile" }
es-runtime-embedded = { path = "crates/es-runtime-embedded" }
es-editor = { path = "crates/es-editor" }
es-eval = { path = "crates/es-eval" }
es-splat = { path = "crates/es-splat" }
es-script = { path = "crates/es-script" }
es-render = { path = "crates/es-render" }
es-usd = { path = "crates/es-usd" }
es-gpu = { path = "crates/es-gpu" }
es-py = { path = "crates/es-py" }
es-ros2 = { path = "crates/es-ros2" }
ash = "0.38.0"
gpu-allocator = { version = "0.28.0", default-features = false, features = [
    "vulkan",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
blake3 = "1"
thiserror = "2"
proptest = "1"
wide = "0.7"
crossbeam = "0.8"
# egui 0.32 is the newest release whose MSRV is the workspace `rust-version` (1.85); 0.36
# raises it. Minimal features: the editor paints rectangles and lines, nothing else.
# `x11` + `wayland` are required on Linux (spec 26.1's primary platform), not optional: with
# neither, winit hits its own `compile_error!` and the whole workspace fails to build there.
# Neither needs a system -dev package at build time; both are no-ops on Windows/macOS
# (docs/packets/M4/P-M4-R9.md).
eframe = { version = "0.32.3", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = { version = "0.32.3", default-features = false }
# abi3-py312: one compiled extension works on any CPython >= 3.12 (stable ABI), matching the
# project's pinned Python 3.12 (spec 14.2). `extension-module` is what maturin needs to build a
# loadable `.pyd`/`.so`; it is only pulled in behind es-py's own `python` feature (see
# crates/es-py/Cargo.toml) so the default workspace build never links libpython.
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py312"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Determinism (spec 3.4): iteration order of HashMap is non-deterministic.
disallowed_types = "warn"

[profile.release]
debug = 1

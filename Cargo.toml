[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HK416/electric_sheep"

[workspace.dependencies]
es-math = { path = "crates/es-math" }
es-core = { path = "crates/es-core" }
es-ir = { path = "crates/es-ir" }
es-ir-types = { path = "crates/es-ir-types" }
es-assets = { path = "crates/es-assets" }
es-telemetry = { path = "crates/es-telemetry" }
es-physics-core = { path = "crates/es-physics-core" }
es-physics-backend = { path = "crates/es-physics-backend" }
es-data = { path = "crates/es-data" }
es-policy = { path = "crates/es-policy" }
es-actuator = { path = "crates/es-actuator" }
es-sensor = { path = "crates/es-sensor" }
es-env = { path = "crates/es-env" }
es-safety = { path = "crates/es-safety" }
es-compile = { path = "crates/es-compile" }
es-runtime-embedded = { path = "crates/es-runtime-embedded" }
es-editor = { path = "crates/es-editor" }
es-eval = { path = "crates/es-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
blake3 = "1"
thiserror = "2"
proptest = "1"
wide = "0.7"
crossbeam = "0.8"
# egui 0.32 is the newest release whose MSRV is the workspace `rust-version` (1.85); 0.36
# raises it. Minimal features: the editor paints rectangles and lines, nothing else.
eframe = { version = "0.32.3", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = { version = "0.32.3", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Determinism (spec 3.4): iteration order of HashMap is non-deterministic.
disallowed_types = "warn"

[profile.release]
debug = 1

# The cube template, with the cube's position (packets M12/Y5b, R7; `docs/design/editor-redesign.md`
# sections 4 and 6.2): the same SO-101, cube, bin and scripted demonstrator as
# `cube-into-bin.toml`, on the IR route with the one IR-graph combination that has passed the
# demo's acceptance -- M7/U row U3 (`docs/design/visible-learning.md` section 7.31, held-out
# 0.5625): `learning-pretrained.toml` (ImageNet ResNet18 backbone, fine-tuned) on
# `observation-augmented.toml` (random shift and colour jitter while training), U3's run settings
# (`training-hint-u3.toml`), judged by `evaluation-augmented.toml` -- `evaluation.toml` with only
# `observation` moved (`cycle-hint-u3.toml`). The observation's third port is `sim_cube_pose`, the
# simulator-privileged cube pose no real robot reports, so the card is for practice and says so
# (`notice`).
#
# The notice still claims no success. U3 trained on V15's 36,960 frames; the same 200
# demonstrations are 103,881 frames today, and U3's 20,000 steps on them (U3'', section 7.36)
# scored held-out 0/16 -- `training-hint-u3.toml`'s header has the arithmetic. `long` is the
# length comparable to U3's in epochs; it has not been run.
#
# The training stage reads the ImageNet weights from `target/backbone/`, which a fresh checkout
# lacks. `training-hint-u3.toml` declares `base_model_fetch` (packet M12/R8), so `es loop cycle`
# runs `python/es/fetch_backbone.py` with the run's interpreter before it collects, and checks
# the file against the pin; `needs` no longer has to say anything about it.
#
# Every path is a committed document, relative to the repository root, and none is copied (see
# `cube-into-bin.toml`).

kind = "template"
id = "cube-into-bin-hint"
name = "template.cube_into_bin_hint.name"        # es-editor i18n key
summary = "template.cube_into_bin_hint.summary"  # es-editor i18n key
notice = "template.cube_into_bin_hint.notice"    # es-editor i18n key: practice only
robot = "SO-101"
method = "blocks"
needs = ["mujoco", "torch", "vulkan", "render"]
cycle = "tests/fixtures/visible-learning/cycle-hint-u3.toml"
scene = "tests/fixtures/mjcf/so101_pick_place.xml"
demonstrations = 200

# The demonstration program (packet M14/Q3): `Project::create` copies it into the project as
# `teach.toml`, ② edits that copy, and a run's `[collect] expert` names it. This file is never
# written by the editor.
teach = "templates/teach/so101-pick-place.toml"

# The bundle `es policy init` builds for `[collect] policy`: U3's four documents. It is also what
# `training-hint-u3.toml`'s `[policy] bundle` trains (`learning-pretrained.toml` is the
# architecture), and the cycle's expert gate judges it by `evaluation-augmented.toml`, which
# names `observation-augmented.toml` (`XIR-040`). Its declared latency is one control period, as
# the camera-only card's bundle declares; the two cards' demonstrations nevertheless differ from
# about tick 70 on (Y-V item 7, `docs/packets/M12/YV-verification.md`), both 200/200 successful.
[bundle]
task        = "tests/fixtures/visible-learning/task.toml"
observation = "tests/fixtures/visible-learning/observation-augmented.toml"
learning    = "tests/fixtures/visible-learning/learning-pretrained.toml"
deployment  = "tests/fixtures/visible-learning/deployment.toml"

# Training length presets: the `[run] checkpoint_at` series; the last mark is the length. The IR
# route's rule is only that every mark is an optimizer step of the run (`Recipe::marks`):
# `train_act.py` saves at each one, so no mark has to divide another.
#   medium  `training-hint-u3.toml`'s own marks: U3's 20,000 steps.
#   short   and long keep its marks and change only the length, to the camera-only card's 5,000
#           and 60,000 steps, so the two cards' three lengths are the same three lengths.
[lengths]
short  = [1000, 5000]
medium = [1000, 5000, 20000]
long   = [1000, 5000, 20000, 60000]

# What a timed-out attempt is judged by (packets M13/Z4, Z6, R4): the `cube` body's path against
# the region the scene's `bin_*` geoms cover. Last seen inside the bin with the gripper never past
# `release.above` since it went in = not let go; inside otherwise = got there too late; else never
# 2 cm above where it started = never lifted; else left outside. The two names are es-editor i18n
# keys. `release` is the Task IR's own threshold: `task.toml`'s success predicate ANDs in
# `joint.gripper.qpos` `Gt 0.85` (its `Compare` node 32), so a cube in the bin in shut jaws still
# times out.
[outcome]
object      = "cube"
target      = "bin"
lift_m      = 0.02
object_name = "outcome.cube"
target_name = "outcome.bin"
release     = { joint = "gripper", above = 0.85 }

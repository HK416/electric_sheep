# The cube template, camera only (packets M12/Y5, Y5b; `docs/design/editor-redesign.md` sections
# 4 and 6.2): an SO-101 puts a cube into a bin, taught by the scripted demonstrator and learned by
# LeRobot's ACT from the camera and the six joint angles -- what a real robot has. No camera-only
# route has passed on this task yet, so the card says so (`notice`); `cube-into-bin-hint.toml` is
# the route that has, with the simulator's cube pose in the policy's input.
#
# Every path is a committed document, relative to the repository root, and none is copied: a
# scene path is hash input (`SceneRef::canonical`), so a copy would move every hash downstream
# and the template would no longer name the documents its numbers were measured on.

kind = "template"
id = "cube-into-bin"
name = "template.cube_into_bin.name"        # es-editor i18n key
summary = "template.cube_into_bin.summary"  # es-editor i18n key
notice = "template.cube_into_bin.notice"    # es-editor i18n key: experimental
robot = "SO-101"
method = "blocks"
needs = ["mujoco", "torch", "lerobot", "vulkan", "render"]
cycle = "tests/fixtures/visible-learning/cycle-vision.toml"
scene = "tests/fixtures/mjcf/so101_pick_place.xml"
demonstrations = 200

# The demonstration program (packet M14/Q3): `Project::create` copies it into the project as
# `teach.toml`, ② edits that copy, and a run's `[collect] expert` names it. This file is never
# written by the editor.
teach = "templates/teach/so101-pick-place.toml"

# The bundle `es policy init` builds for `[collect] policy`, which is also the expert gate's
# `--policy`. The gate judges it by `evaluation-v8.toml`, whose `observation` is
# `observation-v8.toml`, so the bundle carries that document (`XIR-040`). No committed Learning IR
# takes its ports and none is added (`XIR-010`): with no `learning`, `es policy init` writes spec
# 8.1's external-policy shape, the one `es policy import-lerobot` writes for every checkpoint of
# this route. Under `--expert` its weights are never loaded; its Deployment IR is the Safety Plane
# the demonstrator runs under.
[bundle]
task        = "tests/fixtures/visible-learning/task.toml"
observation = "tests/fixtures/visible-learning/observation-v8.toml"
deployment  = "tests/fixtures/visible-learning/deployment.toml"

# Training length presets: the `[run] checkpoint_at` series; the last mark is the length.
# `lerobot-train` saves at one `--save_freq`, which `es train` takes as the first mark, so every
# mark is a multiple of the first (`Recipe::save_freq`).
#   short   a quick look that the whole cycle runs: a quarter of `medium`.
#   medium  `training-lerobot.toml`'s own marks.
#   long    60,000 steps: the checkpoint at which LeRobot's ACT passed held-out 15/16 on this
#           task (packets M5/V19, V19b -- with the cube's pose in its state; this camera-only
#           route has not been measured on the current harness at any length).
[lengths]
short  = [2500, 5000]
medium = [10000, 20000]
long   = [20000, 40000, 60000]

# What a timed-out attempt is judged by (packets M13/Z4, Z6, R4): the `cube` body's path against
# the region the scene's `bin_*` geoms cover. Last seen inside the bin with the gripper never past
# `release.above` since it went in = not let go; inside otherwise = got there too late; else never
# 2 cm above where it started = never lifted; else left outside. The two names are es-editor i18n
# keys. `release` is the Task IR's own threshold: `task.toml`'s success predicate ANDs in
# `joint.gripper.qpos` `Gt 0.85` (its `Compare` node 32), so a cube in the bin in shut jaws still
# times out.
[outcome]
object      = "cube"
target      = "bin"
lift_m      = 0.02
object_name = "outcome.cube"
target_name = "outcome.bin"
release     = { joint = "gripper", above = 0.85 }

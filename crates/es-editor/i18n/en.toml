# Every word the editor shows, in English (packet M7/E6).
#
# Flat keys, quoted so TOML keeps them flat, grouped by a dotted prefix. `ko.toml` holds the
# same key set and `i18n_tables_are_complete_and_used` fails if the two ever drift, if a key
# here is never used by the crate, or if a `t("...")` names a key that is not here.
#
# A `*.hint` value is hover text: it is the one place a raw name, a flag or a spec section may
# appear, because that is what a hover is for. No other value cites the spec.


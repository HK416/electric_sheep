[package]
name = "es-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "es-editor -- read-only layered graph view, telemetry and before/after images (spec 23)"

[[bin]]
name = "es-editor"
path = "src/main.rs"

[features]
# The native Open dialog (packet M7/E6) lives in `es-editor-model`'s `model/dialogs.rs`. This
# forwards to that crate's feature, which is taken without its defaults, so a
# `--no-default-features` build of the editor still has no dialog.
default = ["file-dialogs"]
file-dialogs = ["es-editor-model/file-dialogs"]

[dependencies]
# The headless half (packet M12/R4): everything the window shows. Spec 4.2 rule 4: nothing
# but this crate depends on it.
es-editor-model = { workspace = true }
es-ir = { workspace = true }
es-compile = { workspace = true }
es-eval = { workspace = true }
es-render = { workspace = true }
# The viewport's one device (packet M16/H9, `src/gpu.rs`): the editor draws with `es-render`
# in process since the owner's decision of 2026-10-01. `es-editor-model` stays without it.
es-gpu = { workspace = true }
# `persistence` is the one feature added on top of the workspace's minimal set: it is what
# gives `eframe::App::save` a `Storage`, and the recent-files list (packet M7/E3) is kept
# there rather than in a config file of this crate's own invention. No new dependency entry -
# the feature pulls `ron` and `home` in behind eframe, both already in its own tree.
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true }
# The dock under the step bar (packet M12/Y10): panes a person can drag and re-dock.
egui_dock = { workspace = true }

[lints]
workspace = true

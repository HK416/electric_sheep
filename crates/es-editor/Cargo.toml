[package]
name = "es-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "es-editor -- read-only layered graph view, telemetry and before/after images (spec 23)"

[[bin]]
name = "es-editor"
path = "src/main.rs"

[dependencies]
es-core = { workspace = true }
es-ir = { workspace = true }
es-compile = { workspace = true }
es-telemetry = { workspace = true }
# The Run tab (packet M7/E1) reads a finished run's own artifacts: `report.json` through
# `es-ir`, `events.json` through `es_eval::runner::StepEvent`, and its `events` bitset through
# `es_safety::EventSet`. Both are below layer 12; neither is re-implemented here.
es-eval = { workspace = true }
es-safety = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
es-math = { workspace = true }

[lints]
workspace = true

[package]
name = "es-runtime-embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
es-core = { workspace = true }
es-math = { workspace = true }
es-ir = { workspace = true }
es-compile = { workspace = true }
es-safety = { workspace = true }
es-policy = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Installs es-core's allocation counter for this crate's tests (P17), so the chunk-reuse path
# of `tick` can be asserted allocation-free (spec 9.6).
es-core = { workspace = true, features = ["alloc-count"] }

[lints]
workspace = true

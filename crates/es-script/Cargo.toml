[package]
name = "es-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# spec 14.5 AnthropicProvider (crates/es-script/src/generate.rs): pulls in ureq + its TLS
# backend, so the default build (and `es`'s default build) stays TLS-free.
llm = ["dep:ureq"]

[dependencies]
es-core = { workspace = true }
es-ir = { workspace = true }
es-ir-types = { workspace = true }
es-compile = { workspace = true }
es-eval = { workspace = true }
es-data = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "2", optional = true, default-features = false, features = ["json", "tls"] }

[dev-dependencies]
proptest = { workspace = true }
es-ir = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[package]
name = "es-env"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
es-core = { workspace = true }
es-math = { workspace = true }
es-ir = { workspace = true }
es-assets = { workspace = true }
es-physics-core = { workspace = true }
es-compile = { workspace = true }
es-policy = { workspace = true }
es-safety = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# `render` only (spec 4.2: layer 5 and layer 2, both below this crate's layer 9). Off by
# default, so the default build of `es-env` -- and `es-runtime-embedded`, `es-ros2` and
# `es eval run` with it -- links no Vulkan at all.
es-render = { workspace = true, optional = true }
es-gpu = { workspace = true, optional = true }

[features]
default = []
render = ["dep:es-render", "dep:es-gpu"]

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

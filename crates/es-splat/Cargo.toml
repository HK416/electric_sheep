[package]
name = "es-splat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
es-core = { workspace = true }
es-math = { workspace = true }
es-assets = { workspace = true }
serde = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Installs es-core's allocation counter for this crate's tests (P17/P-M3-R3), so
# `tests/splat.rs` can bound the ascii PLY reader's reserve on a hostile header.
es-core = { workspace = true, features = ["alloc-count"] }

[lints]
workspace = true

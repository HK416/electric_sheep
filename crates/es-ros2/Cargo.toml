[package]
name = "es-ros2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Off by default (design note section 2, spec 4.2): `es` and any embedded consumer must not
# link zenoh. `cargo xtask ci` turns this on for `es-ros2` specifically.
zenoh = ["dep:zenoh"]

[dependencies]
es-core = { workspace = true }
es-safety = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Pinned exactly: what ROS 2's zenoh_cpp_vendor builds against (docs/api-notes/rmw-zenoh.md).
# `default-features = false` + `xxh3` only: this packet needs `xxh3_128` for GID, nothing else
# (no zenoh, no tokio; `cargo tree -p es-ros2 -e normal` must show neither).
# `xxhash-rust` 0.8.18 declares no `rust_version`; verified directly: `cargo +1.85 check -p
# es-ros2 --all-targets` passes against the workspace's pinned `rust-version = "1.85"`.
xxhash-rust = { version = "=0.8.18", default-features = false, features = [
    "xxh3",
] }
# Pinned exactly to what ROS 2's `zenoh_cpp_vendor` builds (`docs/api-notes/zenoh-rs.md`).
# `default-features = false` + `transport_tcp` only: no rustls/ring/quinn/rsa (spec 25.1 —
# nothing listens beyond localhost by default; TLS for remote links is not this crate's job),
# no `unstable`/`internal`/`shared-memory`. Optional: gated behind the `zenoh` feature above.
zenoh = { version = "=1.8.0", default-features = false, features = [
    "transport_tcp",
], optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
es-core = { workspace = true, features = ["alloc-count"] }

[lints]
workspace = true

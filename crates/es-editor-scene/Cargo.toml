[package]
name = "es-editor-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "es-editor-scene -- the editor's scene model: the scene document, commands, undo, checks, save (plan G, G5); only es-editor depends on it"

[dependencies]
# The scene document (`*.esscene`, G1) and its expansion, the check every command passes.
es-assets = { workspace = true }
# The task specification (`*.estask`, G3a) a rename rewrites, and `generate` (G3b) after a save.
es-script = { workspace = true }
# Euler degrees in the inspector through the offline-path trigonometry (spec 3.2).
es-math = { workspace = true }
# The semantic mapping report (spec 17.2) every command is checked against.
es-physics-backend = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
es-ir = { workspace = true }
blake3 = { workspace = true }

[lints]
workspace = true

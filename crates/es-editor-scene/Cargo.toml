[package]
name = "es-editor-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "es-editor-scene -- the editor's scene model: the scene document, commands, undo, checks, save (plan G, G5), picking and gizmos (G6), Add and file import (G7); only es-editor depends on it"

[dependencies]
# The scene document (`*.esscene`, G1) and its expansion, the check every command passes.
es-assets = { workspace = true }
# The task specification (`*.estask`, G3a) a rename rewrites, and `generate` (G3b) after a save.
es-script = { workspace = true }
# Euler degrees in the inspector through the offline-path trigonometry (spec 3.2).
es-math = { workspace = true }
# The semantic mapping report (spec 17.2) every command is checked against.
es-physics-backend = { workspace = true }
# The viewport's headless half (packet M17/G6): the renderer's tessellation and nearest-hit
# rule for picking, its free camera for rays and handles; layer 5, no device.
es-render = { workspace = true }
es-core = { workspace = true }
# The cameras a policy sees, as its Task IR and Observation IR declare them (the corner view).
es-ir = { workspace = true }
# ①'s Add (packet M17/G7): files copied into the project under their content's blake3; the robot
# library's list (`templates/robots.toml`); a glTF's buffer files and the picture import's
# texture and material, read and made as the documents' own serde types.
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

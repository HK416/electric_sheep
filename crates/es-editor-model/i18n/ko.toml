# 편집기가 보여 주는 모든 문구의 한국어판 (작업 패킷 M7/E6).
#
# `en.toml`과 키 집합이 정확히 같아야 하며, 어긋나면 `i18n_tables_are_complete_and_used`가
# 실패한다. 파일 이름·해시·플래그 같은 기술 식별자는 번역하지 않고 그대로 둔다.
#
# `*.hint` 값은 마우스를 올렸을 때 나오는 설명이다. 원래 이름과 명세 절 번호가 나와도 되는
# 곳은 여기뿐이다.
#
# 칸 뒤의 조사는 `이(가)`, `은(는)`, `을(를)`, `와(과)`, `(으)로`로 적는다. `fill`로 채운 문구와 ①의
# 과제 문장은 앞 낱말의 끝소리로 그중 하나를 고른다 (`i18n.rs`의 `ending`, 작업 패킷 M17/R4).


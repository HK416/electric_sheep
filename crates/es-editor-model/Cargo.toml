[package]
name = "es-editor-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "es-editor-model -- the editor's headless view-models and string tables (spec 23); only es-editor depends on it"

[features]
# The native Open dialog (packet M7/E6). Default, but `rfd` is only *declared* for Windows and
# macOS, and `model/dialogs.rs` gates on `all(feature = "file-dialogs", any(windows, macos))` -
# cargo has no per-target default feature, and this is the same effect: Linux compiles the
# `None` stub whether or not the feature is on, and gains no GTK or portal requirement.
# `es-editor` takes this crate without default features and forwards its own `file-dialogs`.
default = ["file-dialogs"]
file-dialogs = ["dep:rfd"]

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { workspace = true, optional = true }

[dependencies]
es-core = { workspace = true }
es-ir = { workspace = true }
es-compile = { workspace = true }
es-telemetry = { workspace = true }
# The Run tab (packet M7/E1) reads a finished run's own artifacts: `report.json` through
# `es-ir`, `events.json` through `es_eval::runner::StepEvent`, and its `events` bitset through
# `es_safety::EventSet`. Both are below layer 12; neither is re-implemented here.
es-eval = { workspace = true }
es-safety = { workspace = true }
# A project (packet M12/Y5, Y6) builds its collect bundle with `es_data::training::
# untrained_bundle` and writes its run recipe as an `es_data::training::Cycle`: the same code
# `es policy init` and `es loop cycle` run, not a second copy. Layer 10, below this one.
es-data = { workspace = true }
# The Replay panel (packet M7/E2) re-poses a recorded `.estraj` and projects it on the CPU:
# the scene loader, the trajectory, the tessellation and the camera are all theirs. `es-env`
# is taken **without** its `render` feature, so the editor links no Vulkan of its own.
es-assets = { workspace = true }
es-env = { workspace = true }
es-math = { workspace = true }
es-render = { workspace = true }
# `model/layout.rs` keeps the dock arrangement in `eframe::Storage` beside the recent list;
# `persistence` is what gives eframe that `Storage` (packet M7/E3), and it pulls `ron` and
# `home` in behind eframe, both already in its own tree. `model/fonts.rs` builds an
# `egui::FontDefinitions` and `model/layout.rs` an `egui_dock::DockState`. None needs a display.
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true }
egui_dock = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
es-math = { workspace = true }
# The `.estraj` fixture generator only: `es_env::Trajectory` is shaped by a `ModelInfo` and
# filled from a `StateView`, and both are `es-physics-core`'s plain structs. The editor itself
# never names them, so this stays out of the normal build.
es-physics-core = { workspace = true }

[lints]
workspace = true

[package]
name = "es-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
es-core = { workspace = true }
es-ir = { workspace = true }
es-math = { workspace = true }
# The learning loop (spec 13): `collect` rolls out a policy through the env runtime with the
# mandatory Safety Plane. es-data is layer 10, so every one of these is strictly lower.
es-assets = { workspace = true }
es-compile = { workspace = true }
es-env = { workspace = true }
es-physics-core = { workspace = true }
es-policy = { workspace = true }
es-safety = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
# Default features pull in arrow + five compression codecs; the LeRobot columns this crate
# reads and writes are plain/uncompressed primitives, so the low-level column API is enough.
parquet = { version = "59.3", default-features = false }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

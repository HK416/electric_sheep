[package]
name = "es-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
es-core = { workspace = true }
es-ir = { workspace = true }
es-math = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
# Default features pull in arrow + five compression codecs; the LeRobot columns this crate
# reads and writes are plain/uncompressed primitives, so the low-level column API is enough.
parquet = { version = "59.3", default-features = false }

[dev-dependencies]
proptest = { workspace = true }
# Oracle only (P-M2-R2): a converted config must actually plan. es-data is layer 10 and
# es-compile layer 7, so this is a legal, strictly-lower dependency.
es-compile = { workspace = true }

[lints]
workspace = true

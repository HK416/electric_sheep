[package]
name = "es-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `cdylib` is what maturin loads as the `es_native` Python extension module; `rlib` keeps the
# crate usable as an ordinary Rust dependency (the integration test links it that way) and lets
# `cargo test --workspace` / `cargo check --workspace` build it with zero Python involvement.
[lib]
name = "es_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Layer 11 may depend on anything below it (spec 4.2). The rollout binding (packet M8/S4a)
# is what needs the runtime half: `es-env` (9) owns the env, `es-eval` (10) the observation
# capture it shares with `es eval run`, `es-safety` (8) the plane, `es-physics-backend` (4)
# the MuJoCo reference backend.
es-core = { workspace = true }
es-physics-core = { workspace = true }
es-physics-backend = { workspace = true }
es-safety = { workspace = true }
es-env = { workspace = true }
es-eval = { workspace = true }
es-ir = { workspace = true }
es-ir-types = { workspace = true }
es-compile = { workspace = true }
es-assets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
pyo3 = { workspace = true, optional = true }
# The Vulkan device `Rollout`'s renderers borrow (packet M11/X3). Only under `render`.
es-gpu = { workspace = true, optional = true }

[dev-dependencies]
# Oracle only (packet M11/X3): the collector `es loop collect --frames` runs, in-process, as
# the reference a `Rollout` frame is compared to. Both are layer 10 / 8, below this crate.
es-data = { workspace = true }
es-policy = { workspace = true }

# Off by default so `cargo build`/`cargo test --workspace` never require a Python dev
# environment (CLAUDE.md, spec 2.1: Python is first-class on the learning/authoring path only,
# never on the core). `maturin` turns this on via `--features python`.
[features]
default = []
python = ["dep:pyo3"]
# `Rollout` renders the image inputs of its Observation IR (packet M11/X3): one
# `es_env::EnvRenderer` per env, built through `es_env::render::sensor_cfg` like the collector's.
# Off by default for the reason `es-env`'s own `render` is: it is what links Vulkan. Without it
# an image input is refused by name, as it always was.
render = ["es-env/render", "dep:es-gpu"]

[lints]
workspace = true

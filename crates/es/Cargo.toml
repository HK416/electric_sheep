[package]
name = "es"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "es -- Electric Sheep runtime/CLI (spec 2.5, 10.5, 11.1)"

[[bin]]
name = "es"
path = "src/main.rs"

[features]
# `render` is on by default since packet M12/R5 (owner decision H-1): without it the editor's
# start screen keeps both cube templates disabled. `--no-default-features` still builds a CLI
# that links no Vulkan at all and refuses `--frames`.
default = ["render"]
# `es task generate --provider anthropic` (spec 14.5); off by default so the default build
# never links a TLS stack (see crates/es-script/Cargo.toml's own `llm` feature).
es-script-llm = ["es-script/llm"]
# `es loop collect --frames` (spec 15.2, packet M5/V2) and `es eval run --frames` (spec 10.5,
# packet M5/V3). A build without it links no Vulkan at all -- the trade `es-env`'s own
# `render` feature still makes off by default. `es-render` is direct because a light
# perturbation sets `RenderConfig::light_dir`, which `EnvRendererCfg` does not carry
# (packet M5/V3, design note section 7.8). `es-tools/render` is `es video showcase`, which
# moved out with the rest of the artifact verbs (packet M10/W3b).
render = ["es-tools/render", "es-env/render", "dep:es-gpu", "dep:es-render"]

[dependencies]
es-ir = { workspace = true }
es-compile = { workspace = true }
es-physics-backend = { workspace = true }
es-physics-core = { workspace = true }
es-usd = { workspace = true }
es-assets = { workspace = true }
es-data = { workspace = true }
es-telemetry = { workspace = true }
es-eval = { workspace = true }
es-env = { workspace = true }
es-safety = { workspace = true }
es-policy = { workspace = true }
es-script = { workspace = true }
# `es video|showcase|backend|evidence|gap|bench` plus `CliError` / `hex` (packet M10/W3b).
es-tools = { workspace = true }
es-gpu = { workspace = true, optional = true }
es-render = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
blake3 = { workspace = true }
# `es train`'s interpreter probe retries a start the Windows loader failed (packet M15/R1).
es-core = { workspace = true }

[dev-dependencies]
es-math = { workspace = true }
# `tests/cli.rs` signs an evidence bundle to check `es evidence verify --trust`; the verb
# itself moved to `es-tools` (packet M10/W3b), so this is a dev dependency now.
ed25519-dalek = "3.0.0"

[lints]
workspace = true

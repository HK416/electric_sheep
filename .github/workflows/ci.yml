name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: PR gate (spec 26.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: xtask verify-goldens diffs against the merge-base with main.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@v2

      # `cargo xtask ci` runs the test step with `--nocapture` and scans the output for
      # `^SKIP` lines from the GPU oracles (es-gpu / es-render / es-compile's GPU lowering).
      # This runner has no GPU, no Vulkan loader and no `slangc`, so those tests SKIP by
      # design and `ES_REQUIRE_GPU` is deliberately left **unset**: the skips are printed as
      # `NOTE GPU oracle skipped` and do not fail the job. Set `ES_REQUIRE_GPU=1` on a runner
      # that actually has a GPU — then a SKIP is a hard failure, the way
      # `cargo xtask nostd --require` treats a missing target (review `docs/reviews/M4.md`
      # S-7, packet `docs/packets/M4/P-M4-R6.md`).
      - name: cargo xtask ci
        run: cargo xtask ci

      # `cargo xtask ci` runs `nostd` too, but SKIPs quietly if the target isn't installed
      # (the common case on a dev machine). The toolchain step above installs it here, so
      # `--require` turns a SKIP into a hard failure instead of a silently rotting check
      # (review `docs/reviews/M3.md` Should-fix, packet `docs/packets/M3/P-M3-R4.md`).
      - name: cargo xtask nostd (required)
        run: cargo xtask nostd --require

  # Tier 2 (spec 1.4, 28.7): the reference oracles the PR job cannot run without an environment
  # that has MuJoCo/PyTorch installed. Deliberately not on the PR path — installing Python +
  # two large wheels would blow the < 10 min PR budget (spec 26.2) — so this only runs on a push
  # to main or a manual dispatch, and its failure is real (`continue-on-error: false`), not a
  # soft signal.
  oracles:
    name: Reference oracle tier (spec 1.4, 28.7)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Versions pinned in docs/api-notes/mujoco.md, torch.md and torchvision.md. mujoco_warp
      # needs a GPU this runner does not have, so it is excluded below and stays
      # `Target / Status: unverified` (spec 12.4) rather than faked green.
      - name: install reference oracles
        run: |
          python -m pip install --upgrade pip
          python -m pip install mujoco==3.13.0
          # torchvision pulls torch 2.14.0 with it; it is what generates the observation
          # goldens, so without it `gen_goldens` SKIPs and their provenance is unchecked.
          python -m pip install torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu

      - name: cargo test against the reference oracles
        env:
          ES_PYTHON: python
        run: |
          set -euo pipefail
          cargo test -p es-physics-backend -p es-policy -p es-compile -- --skip mjwarp --nocapture 2>&1 | tee oracles.log
          ! grep -q '^SKIP' oracles.log

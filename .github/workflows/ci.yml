name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: PR gate (spec 26.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: xtask verify-goldens diffs against the merge-base with main.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@v2

      # `cargo xtask ci` runs the test step with `--nocapture` and scans the output for
      # `^SKIP` lines from the GPU oracles (es-gpu / es-render / es-compile's GPU lowering).
      # This runner has no GPU, no Vulkan loader and no `slangc`, so those tests SKIP by
      # design and `ES_REQUIRE_GPU` is deliberately left **unset**: the skips are printed as
      # `NOTE GPU oracle skipped` and do not fail the job. Set `ES_REQUIRE_GPU=1` on a runner
      # that actually has a GPU — then a SKIP is a hard failure, the way
      # `cargo xtask nostd --require` treats a missing target (review `docs/reviews/M4.md`
      # S-7, packet `docs/packets/M4/P-M4-R6.md`).
      - name: cargo xtask ci
        run: cargo xtask ci

      # `cargo xtask ci` runs `nostd` too, but SKIPs quietly if the target isn't installed
      # (the common case on a dev machine). The toolchain step above installs it here, so
      # `--require` turns a SKIP into a hard failure instead of a silently rotting check
      # (review `docs/reviews/M3.md` Should-fix, packet `docs/packets/M3/P-M3-R4.md`).
      - name: cargo xtask nostd (required)
        run: cargo xtask nostd --require

  # Tier 2 (spec 1.4, 28.7): the reference oracles the PR job cannot run without an environment
  # that has MuJoCo/PyTorch installed. Deliberately not on the PR path — installing Python +
  # two large wheels would blow the < 10 min PR budget (spec 26.2) — so this only runs on a push
  # to main or a manual dispatch, and its failure is real (`continue-on-error: false`), not a
  # soft signal.
  oracles:
    name: Reference oracle tier (spec 1.4, 28.7)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Versions pinned in docs/api-notes/mujoco.md, torch.md, torchvision.md and newton.md.
      # Everything here runs on a CPU: newton through warp's CPU device, diffusers is pure
      # Python. mujoco_warp needs a CUDA GPU this runner does not have, so it is excluded below
      # and stays `Target / Status: unverified` (spec 12.4) rather than faked green (P-M4-R11).
      - name: install reference oracles
        run: |
          python -m pip install --upgrade pip
          python -m pip install mujoco==3.13.0
          # torchvision pulls torch 2.14.0 with it; it is what generates the observation
          # goldens, so without it `gen_goldens` SKIPs and their provenance is unchecked.
          python -m pip install torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers==0.40.0 newton==1.6.0 warp-lang==1.17.0

      # lerobot 0.6.1 is pinned to torch 2.11 / torchvision 0.26 (docs/api-notes/lerobot-act.md)
      # and cannot share the torch 2.14 environment above, so the ACT oracle gets its own venv.
      # The checkpoint download is the api-note's: pinned revision, safetensors/json only, and
      # an assertion that no pickle-loadable file landed (INV-16). It goes to RUNNER_TEMP, not
      # target/, so rust-cache never stores the weights.
      - name: install the LeRobot ACT oracle
        env:
          ES_ACT_CHECKPOINT: ${{ runner.temp }}/lerobot-cache/act_aloha_sim_transfer_cube_human
        run: |
          python -m venv "$RUNNER_TEMP/lerobot-venv"
          LEROBOT_PY="$RUNNER_TEMP/lerobot-venv/bin/python"
          "$LEROBOT_PY" -m pip install --upgrade pip
          "$LEROBOT_PY" -m pip install torch==2.11.0+cpu torchvision==0.26.0+cpu lerobot==0.6.1 --extra-index-url https://download.pytorch.org/whl/cpu
          "$LEROBOT_PY" - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          REVISION = "ba73b2766f1371cdc133ca4efb97eb090d744625"  # docs/api-notes/lerobot-act.md
          path = snapshot_download(
              "lerobot/act_aloha_sim_transfer_cube_human",
              revision=REVISION,
              allow_patterns=["*.safetensors", "*.json"],
              local_dir=os.environ["ES_ACT_CHECKPOINT"],
          )
          banned = [p for pat in ("*.bin", "*.pt", "*.ckpt", "*.pkl") for p in Path(path).rglob(pat)]
          assert not banned, f"pickle-loadable file(s) in snapshot: {banned}"
          PY

      - name: cargo test against the reference oracles
        env:
          ES_PYTHON: python
        run: |
          set -euo pipefail
          # The ACT oracle runs in the next step, against the LeRobot interpreter.
          cargo test -p es-physics-backend -p es-policy -p es-compile -- --skip mjwarp --skip a_real_lerobot_act_checkpoint --nocapture 2>&1 | tee oracles.log
          # No GPU and no slangc here, so es-compile's GPU lowering tests (tests/observation_gpu.rs)
          # SKIP with exactly these two reasons; they run on a GPU host under
          # `ES_REQUIRE_GPU=1 cargo xtask ci`. Any other SKIP means an oracle installed above
          # silently did not run, and fails the job.
          if grep '^SKIP' oracles.log | grep -vE '^SKIP [a-z0-9_]+: no (slangc|Vulkan device) \('; then
            echo "::error::a CPU reference oracle skipped (see the lines above)"
            exit 1
          fi

      - name: cargo test against the LeRobot ACT checkpoint
        env:
          ES_PYTHON: ${{ runner.temp }}/lerobot-venv/bin/python
          ES_ACT_CHECKPOINT: ${{ runner.temp }}/lerobot-cache/act_aloha_sim_transfer_cube_human
        run: |
          set -euo pipefail
          cargo test -p es-policy --test act_checkpoint -- --nocapture 2>&1 | tee act.log
          # A skip prints no RAN line, so this is what fails the step when the oracle did not run.
          grep -q '^RAN act_checkpoint' act.log

# Plan N's experiment 1, the three-view arm (packet M15/N1, docs/packets/M15/plan-n.md,
# docs/design/multi-camera.md section 4): the hint card's cycle, `cycle-hint-u3.toml`, camera only
# and seen by three cameras. What differs from it, and nothing else does:
#
# * `scene` is so101_pick_place_views.xml: the demo scene plus the `wrist` and `side` cameras.
# * `[train] recipe` is training-views.toml: U3's run settings, value for value.
# * `[eval] config` is evaluation-views.toml: evaluation-augmented.toml's suites, seeds 101-116,
#   metrics and `success_rate >= 0.5`, naming task-views.toml and observation-views.toml.
# * `[eval.preview]` at its defaults: a short test of each checkpoint while training runs.
#
# `cargo test -p es --test views views_recipes_and_cycles_mirror_the_hint_card` holds all of that.
# The same 200 expert demonstrations on seed 1, the same expert gate, the same showcase camera.
#
# `[collect] policy` is the bundle `es policy init` builds from the arm's four documents -- the
# committed deployment.toml among them, which names no camera:
#
#   es policy init --task tests/fixtures/visible-learning/task-views.toml \
#       --observation tests/fixtures/visible-learning/observation-views.toml \
#       --learning tests/fixtures/visible-learning/learning-views.toml \
#       --deployment tests/fixtures/visible-learning/deployment.toml \
#       --out runs/collect-001/untrained.esb
#
# `policy_init_builds_each_arms_bundle_and_the_gate_accepts_it` (crates/es/tests/views.rs) builds
# it and makes the expert gate's two checks on it. The one-view arm's bundle carries the same
# Task IR, so one collection serves both arms (cycle-cam.toml).
#
# Rendering, baking and evaluating several cameras per step is plan N's packets N2 and N3; until
# they land only `--dry-run` is meaningful here. `es loop cycle --recipe
# tests/fixtures/visible-learning/cycle-views.toml --out <dir> --dry-run` needs neither the
# dataset, the bundle, the backbone nor Python.

kind  = "cycle"
scene = "tests/fixtures/mjcf/so101_pick_place_views.xml"

[collect]
policy   = "runs/collect-001/untrained.esb"
expert   = "so101-pick-place"
episodes = 200
seed     = 1
frames   = true

[train]
recipe = "tests/fixtures/visible-learning/training-views.toml"

[eval]
config     = "tests/fixtures/visible-learning/evaluation-views.toml"
checkpoint = "last"
jobs       = 6
frames     = true

[eval.preview]

[showcase]
cell    = "nominal-00"
eye     = [0.66, -0.46, 0.52]
look_at = [0.14, -0.04, 0.04]
fov     = 36
width   = 1280
height  = 720

# Evaluation IR (spec 10) for the path-traced SO-101 demo -- plan U, packet M7/R5.
#
# Generated by `cargo test -p es --test cli -- --ignored generate_pt_fixtures`; the committed
# evaluation.toml with `task` and `observation` replaced by task-pt.toml's and
# observation-pt.toml's own hashes. Same 16 held-out seeds, same six suites, same perturbation
# parameters, same acceptance -- a diff with the two fields put back is empty.
#
# It is a separate document and not a widened one because spec 13.3 says so: the Task IR it
# names is a different Task IR, so a report produced under it is not chained to a report
# produced under evaluation.toml. A reader may compare the two by judgement; the hash chain
# does not.

es_schema = 1
kind = "evaluation"

[body]
augmentation = "disabled"
metrics = [
    "success_rate",
    "episode_length",
    "envelope_violation_rate",
    "failure_mode_histogram",
]
observation = "7caac85da110d516f0be4e3056646aab24fe1cb43d50308035f49ad353783cc7"
replay = "failures_first"
schema_version = 1
task = "d546b80804dd035ed6c696ddc251f8ce2d68d1a3964407d00f76af746c95e2fa"

[[body.acceptance]]
aggregation = "mean"
comparator = "ge"
metric = "success_rate"
suite = "nominal"
threshold = 0.5

[body.episodes]
n_episodes = 16

[body.episodes.seeds]
explicit = [
    101,
    102,
    103,
    104,
    105,
    106,
    107,
    108,
    109,
    110,
    111,
    112,
    113,
    114,
    115,
    116,
]

[[body.suites]]
name = "nominal"
perturbations = []

[[body.suites]]
name = "light_intensity"

[[body.suites.perturbations]]
stream = 0

[body.suites.perturbations.kind.light_intensity]
dist = "uniform"

[body.suites.perturbations.kind.light_intensity.range]
hi = 1.5
lo = 0.5

[[body.suites]]
name = "light_direction"

[[body.suites.perturbations]]
stream = 1

[body.suites.perturbations.kind.light_direction]
range_deg = 45.0

[[body.suites]]
name = "observation_delay"

[[body.suites.perturbations]]
stream = 2

[body.suites.perturbations.kind.observation_delay]
ms = [
    20,
    40,
]

[[body.suites]]
name = "torque_noise"

[[body.suites.perturbations]]
stream = 3

[body.suites.perturbations.kind.torque_noise]
rel_sigma = 0.05

[[body.suites]]
name = "backlash"

[[body.suites.perturbations]]
stream = 4

[body.suites.perturbations.kind.backlash.rad]
hi = 0.01
lo = 0.0

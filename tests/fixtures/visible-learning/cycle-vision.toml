# The cube template's cycle (packet M12/Y5, `docs/design/editor-redesign.md` sections 4 and 6.2):
# `cycle.toml` with two words changed, so the run the editor starts is the vision route.
#
# * `[train] recipe` is `training-lerobot.toml`: LeRobot's own ACT, trained by `lerobot-train`,
#   on `observation-v8.toml` -- the arm's six joint angles and the overhead camera, nothing else.
#   `cycle.toml` names `training.toml`, the IR-graph policy on `observation.toml`, whose third
#   port is `sim_cube_pose`: the simulator-privileged cube pose no robot reports. A policy that
#   reads it is not a vision policy, and a template that says "teach it with blocks" must not
#   quietly hand it one.
# * `[eval] config` is `evaluation-v8.toml`: `evaluation.toml`'s suites, seeds 101-116 and
#   `success_rate >= 0.5`, not one number lowered, naming `observation-v8.toml` -- the
#   Observation IR `es policy import-lerobot` carries into every checkpoint, which `XIR-040`
#   requires the Evaluation IR to name.
#
# Everything else is `cycle.toml`'s, word for word: the same 200 expert demonstrations on seed 1
# (outside the evaluation's 101-116), the same expert gate, the same showcase camera. The
# recipe's own `[run]` (20,000 steps, marks 10,000 and 20,000) is the template's `medium`
# length; the editor writes the other two as an inline `[train]`.
#
# `es loop cycle --recipe tests/fixtures/visible-learning/cycle-vision.toml --out <dir> --dry-run`
# prints the stage plan pinned by `tests/golden/train/plan-cycle-vision.txt`, and needs neither
# the dataset, the bundle nor Python.
#
# Open (packet M12/Y5, fact (a)): `[collect] policy` is also the expert gate's `--policy`, and
# `es eval run` checks it against `[eval] config`. The bundle `es policy init` builds from the
# template's documents carries `observation.toml` (`8a528bc0…`), which `evaluation-v8.toml`
# does not name (`3009284b…`), so the gate refuses it (`XIR-040`); and no committed Learning IR
# takes `observation-v8.toml`'s ports (`XIR-010`), so no four committed documents make a bundle
# this gate accepts. `--dry-run` opens neither, which is why the golden is unaffected.

kind  = "cycle"
scene = "tests/fixtures/mjcf/so101_pick_place.xml"

[collect]
policy   = "runs/collect-001/untrained.esb"
expert   = "so101-pick-place"
episodes = 200
seed     = 1
frames   = true

[train]
recipe = "tests/fixtures/visible-learning/training-lerobot.toml"

[eval]
config     = "tests/fixtures/visible-learning/evaluation-v8.toml"
checkpoint = "last"
jobs       = 6
frames     = true

[showcase]
cell    = "nominal-00"
eye     = [0.66, -0.46, 0.52]
look_at = [0.14, -0.04, 0.04]
fov     = 36
width   = 1280
height  = 720

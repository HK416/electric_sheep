# M10/W1a row U5: U4's configuration on the **per-tick-seeded** path-traced documents --
# `task-pt-tick.toml` (the sensor declares `render = { path = "pt", spp = 64, bounces = 3,
# exposure = 64, seed = "tick" }`) with `learning-pretrained.toml` (T5) and the augmented
# Observation IR retargeted at it.
#
# RUN, on the oracle server: `es train --recipe <this> --out ~/artifacts/plan-w/w1a/U5/train`
# from the repository root; `docs/design/visible-learning.md` section 7.37.
#
# Everything but the seed stream is U4's, on purpose, and U4's was U3's: same 200
# demonstrations at the same seeds, same 20,000 steps, same batch 64 / lr 4e-4 /
# warmup_cosine(250, 1e-6) / seed 0, same ImageNet backbone, same `--resident-gpu`. The one
# variable is whether the grain a pose carries stands still, so `success_rate` beside U4's 0.0
# and U3's 0.5625 is a statement about the sample seed and nothing else.
#
# The dataset is **not** U4's `m7-r5/ds-train-pt`: those frames were drawn under the fixed
# seed, and a policy trained on them and evaluated under a moving one would be measuring a
# domain gap nobody declared. `plan-w/w1a/ds-train-pt-tick` is the same 200 episodes at the
# same seed 1, collected again with `--frames` under `task-pt-tick.toml`.
#
# The bundle is `task-pt-tick.toml` + `observation-augmented-pt-tick.toml` +
# `learning-pretrained.toml` + `deployment.toml`, packed by `cargo test -p es --test cli --
# --ignored pack_untrained_bundle` with the four `ES_PACK_*` paths.
# `observation-augmented-pt-tick.toml` is the committed `observation-augmented.toml` with
# `task_ref` pointed at task-pt-tick.toml: the graph is byte-identical, but `task_ref` is hash
# input and `XIR_001` requires it to match, so a new Task IR always drags a new Observation IR
# document behind it (packet M7/R5).
#
# `augmentation_seed` is absent, which means `[run] seed` = 0, which is T6's, U3's and U4's.
# Paths are the oracle server's (RTX 4090).

kind = "training"

[dataset]
root   = "/home/LJM/artifacts/plan-w/w1a/ds-train-pt-tick"
frames = "/home/LJM/artifacts/plan-w/w1a/frames-train-pt-tick"

[policy]
bundle     = "/home/LJM/artifacts/plan-w/w1a/untrained-pretrained-augmented-pt-tick.esb"
base_model = "/home/LJM/artifacts/plan-v/m7-t5/resnet18-imagenet1k-v1.safetensors"

[run]
steps         = 20000
batch         = 64
lr            = 4e-4
seed          = 0
checkpoint_at = [20000]
device        = "cuda"
interpreter   = "/home/LJM/venvs/es-lerobot-cuda/bin/python"
schedule      = { kind = "warmup_cosine", warmup = 250, lr_min = 1e-6 }
extra         = ["--resident-gpu"]

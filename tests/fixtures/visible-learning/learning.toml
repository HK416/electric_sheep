# Learning IR (spec 8) for the SO-101 cube-into-bin demo -- plan V, packet M5/V0.
#
# The ACT-*shaped* Learning IR policy, not LeRobot's ACT (design note section 6.1): it has
# no VAE and no DETR decoder, because `TemporalEncoder { Transformer }` carries only a width.
# `lower_to_torch` lowers every node here, so the module PyTorch optimizes in V2 is the module
# `es eval run` infers with.
#
#   VisionEncoder{ResNet18} -.
#                             Fusion{Concat} -> TemporalEncoder{Transformer}
#   StateEncoder{Mlp[256]}  -'                    -> PolicyHead{Regression} -> ActionChunker
#
# horizon H = 16, execute_chunk = 10, replanning_hz = 5 (= 50 Hz / 10, the integer relation
# XIR-023 requires), action_dim = 6, TemporalEnsemble. (6, 16) is already a row of the
# const-generic dispatch tables in crates/es/src/cmd/eval.rs and crates/es/src/cmd/loop.rs.
#
# `weights` is a `safetensors` reference with an all-zero hash: V2 packs the trained weights
# and recomputes it. No pickle path exists anywhere (INV-16).


# Evaluation IR (spec 10) for the external-ACT demo -- packet M5/V8.
#
# Generated by `cargo test -p es --test cli -- --ignored regenerate_visible_learning_documents`.
# Identical to evaluation.toml in every suite, perturbation, metric and acceptance threshold --
# `success_rate >= 0.5` on seeds 101-116 and not one number lowered. The only thing that moves
# is `observation`, which names observation-v8.toml because that is the Observation IR the
# external policy is fed through (XIR-040).

es_schema = 1
kind = "evaluation"

[body]
augmentation = "disabled"
metrics = [
    "success_rate",
    "episode_length",
    "envelope_violation_rate",
    "failure_mode_histogram",
]
observation = "6f6f27292868b40abe01acaa03b390e849dc1cb6c04d361ee11221a041ac6c65"
replay = "failures_first"
schema_version = 1
task = "6cf826c167fef258414ce409ff51e310a1240fdb4b42b510351d5bae3e3f6b7b"

[[body.acceptance]]
aggregation = "mean"
comparator = "ge"
metric = "success_rate"
suite = "nominal"
threshold = 0.5

[body.episodes]
n_episodes = 16

[body.episodes.seeds]
explicit = [
    101,
    102,
    103,
    104,
    105,
    106,
    107,
    108,
    109,
    110,
    111,
    112,
    113,
    114,
    115,
    116,
]

[[body.suites]]
name = "nominal"
perturbations = []

[[body.suites]]
name = "light_intensity"

[[body.suites.perturbations]]
stream = 0

[body.suites.perturbations.kind.light_intensity]
dist = "uniform"

[body.suites.perturbations.kind.light_intensity.range]
hi = 1.5
lo = 0.5

[[body.suites]]
name = "light_direction"

[[body.suites.perturbations]]
stream = 1

[body.suites.perturbations.kind.light_direction]
range_deg = 45.0

[[body.suites]]
name = "observation_delay"

[[body.suites.perturbations]]
stream = 2

[body.suites.perturbations.kind.observation_delay]
ms = [
    20,
    40,
]

[[body.suites]]
name = "torque_noise"

[[body.suites.perturbations]]
stream = 3

[body.suites.perturbations.kind.torque_noise]
rel_sigma = 0.05

[[body.suites]]
name = "backlash"

[[body.suites.perturbations]]
stream = 4

[body.suites.perturbations.kind.backlash.rad]
hi = 0.01
lo = 0.0

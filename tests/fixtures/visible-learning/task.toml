# Task IR (spec 6) for the SO-101 cube-into-bin demo -- plan V, packet M5/V0.
#
# Scene: tests/fixtures/mjcf/so101_pick_place.xml (see its PROVENANCE.json).
# `scene_hash` is `SceneDesc::scene_hash()` of that file as parsed; `asset_hash` is the
# blake3 of the file's bytes -- the derivative vendors no separate asset.
#
# Parameters, fixed here so V1 and V3 cite them: NJ = 6, control rate 50 Hz,
# max_episode_steps = 400, image 96x96 Rgb8 from the one fixed `overhead` camera.
#
# This document *declares* the ObservationSpec and owns no preprocessing and no neural net
# (spec 5.1): the image chain is observation.toml, the policy is learning.toml.
#
# Randomization (spec 6.3) is the cube free joint's `qpos` only. Mass, friction and
# actuator-gain targets are deliberately absent: `es-env` records such a draw but never
# pushes it into the backend (crates/es-env/src/randomize.rs:24-26), so declaring one would
# put a number in the episode record that never reached the physics.
#
# Two ceilings of the IR-D cone, recorded rather than papered over (design note section 5.4):
#  * `GetJointState` binds one scalar -- a joint's *first* qpos/qvel index
#    (crates/es-env/src/plan.rs:196-206). For the cube's free joint that is `x`, so the
#    success predicate is the bin's x span plus a settling bound, not a 3-axis AABB.
#  * Task IR-D has no constant leaf, and `Arith::Mul`'s right operand is dimensionless under
#    the spec 5.4 unit algebra, so neither `x - c` nor `v * v` is expressible; the shaped
#    reward is a `Normalize` of the cube's x and `|v| < b` is two `Compare`s and an `And`.
# `Normalize` and `Logic` are existing TaskNode variants that `es-env`'s cone lowering does
# not yet handle (plan.rs:125-179) -- that is a V1 change in es-env, not an es-ir change.


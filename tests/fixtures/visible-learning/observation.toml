# Observation IR (spec 7) for the SO-101 cube-into-bin demo -- plan V, packet M5/V0.
#
# `task_ref` is task.toml's `task_hash`. One Task IR may carry several Observation IRs.
#
# The ImageSpec is declared once, here, at the size the renderer will produce: 96x96 Rgb8
# from the `overhead` camera, pinhole, fx = fy = (96/2)/tan(45 deg / 2), principal point at
# the centre. There is no `Resize` and no `Crop` node, so no intrinsics transform is owed
# (spec 7.2, INV-14). There is no `MultiViewPack`: plan lowering rejects it
# (crates/es-compile/src/plan.rs:545), which is why the demo has exactly one camera.
#
# Time model (spec 7.5): `TemporalWindow { n_steps = 1 }`, matching the policy contract's
# `observation_window` (XIR-011); the `TemporalEncoder` lives in learning.toml.
#
# Ceiling: `StateInput` names the robot's `base` body, which is what the Task IR channel
# declares (spec 7.4 / XIR-002) and what DEP-031 measures the Safety Plane envelope against.
# The evaluation runner resolves an observation input against `ModelInfo.qpos`, which is
# keyed by *joint* (crates/es-eval/src/runner.rs:417-420), so feeding this 6-wide state -- and
# the image input, which needs a renderer -- is V0b/V1 work, exactly like the gap the design
# note records in section 2.2.


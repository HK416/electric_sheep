# Deployment IR + Safety Plane (spec 9) for the SO-101 cube-into-bin demo -- packet M5/V0.
#
# The envelope is a *document*, never a switch (INV-12): nothing here can disable the Safety
# Plane, and V3 tightens these numbers for the demo suite rather than bypassing them.
#
# `safety.position` is the scene's own six joint ranges, read out of the parsed MJCF rather
# than transcribed; `torque_max` is the `sts3215` class `forcerange` (2.94 N m). Velocity,
# acceleration and the action-rate limits are chosen for the 50 Hz control tick and are the
# knob V3 turns.
#
# What every number is, physically (packet M5/V6; no number below moved, the defect V6 fixed
# was what the plane measures them *against*, not the limits themselves):
#
#  * The arm is six Feetech `STS3215` serial-bus servos, and the scene drives them as MuJoCo
#    `position` actuators: `kp = 998.22`, `kv = 2.731`, `forcerange = +/-2.94 N m`
#    (tests/fixtures/mjcf/so101_pick_place.xml, `class="sts3215"`). That is a PD loop closed
#    *inside* the servo: the host sends a goal position and the servo makes torque out of the
#    error. `2.94 / 998.22 = 0.0029` rad is where it saturates -- **a following error of three
#    milliradians already means full torque**, and under load it is larger still. So the gap
#    between a command and the measured joint is the servo's *input*, not a velocity, and an
#    envelope that bounded it would be bounding torque, which is `torque_max`'s row.
#  * `velocity_max = 3.0` rad/s. The STS3215 is rated about 0.238 s per 60 deg at 7.4 V, i.e.
#    ~4.4 rad/s unloaded; 3.0 rad/s is roughly two thirds of that, which is about where it
#    runs holding the arm up. At 50 Hz that is `0.06` rad (3.4 deg) of commanded motion per
#    control tick.
#  * `acceleration_max = 20.0` rad/s^2: 3.0 rad/s is reached in 0.15 s, 7.5 control ticks.
#    Feasible with margin -- the rotor alone (`armature = 0.028`) costs `0.028 * 20 = 0.56`
#    N m, a fifth of the stall torque, and the links are grams -- which is the point: a
#    command stream inside this bound is one the servo can actually follow, so the commanded
#    and the measured trajectory stay close. At 50 Hz it allows `0.008` rad of change in the
#    per-tick step, and it is the stage that binds.
#  * `action_rate.first_diff_max = 0.08` (4.0 rad/s) and `second_diff_max = 0.04` rad
#    (100 rad/s^2) are both looser than the two rows above at this control rate, so at 50 Hz
#    neither ever fires. They are the rate backstop for a control rate this file does not
#    have: spec 9.3 bounds the *action's* first and second difference in action units, and
#    that bound must not depend on `rate.control` being 50 Hz.
#  * `position_soft_margin = 0.05` rad (2.9 deg) inside the scene's own joint ranges.
#  * `ee_velocity_max = 0.6` m/s and `contact_force_max`, `min_self_distance`,
#    `min_env_distance` are declared and **not enforced by `es-safety`** -- there is no
#    forward kinematics and no contact query in the plane (docs/design/safety-plane.md,
#    "not implemented"). They are documented limits, not live ones, and saying so here is
#    cheaper than a reader assuming otherwise.
#
# `envelope_violation_rate` is deliberately loose (packet M5/V1). Everything on this path
# commands *joint positions*: a chunk carries where the arm should be, and the plane turns
# each chunk into motion the envelope allows -- so a demonstration that asks for a pose the
# arm has not reached yet is clamped on most ticks by construction, not by anomaly. At V0's
# 0.05 the watchdog latched the fallback a second into every demonstration and froze the arm.
# Widening it is the sanctioned move; disabling the plane is not (INV-12), and every clamp is
# still counted, still recorded as `action_source = Clamped`, and still V3's material.
#
# Rates are integer `TickRate`s (spec 18.1): control 50 Hz, inference 5 Hz. The deadlines are
# whole multiples of the control period -- observation_age 12x, inference_budget 12x,
# actuation_budget 1/2x -- so nothing here is a float duration.
#
# `inference_budget` was 2x (40 ms) until packet M5/V17, and 2x cannot be met by a deployment
# that declares `rate.inference = 5 Hz`. `SafetyPlane` measures `ViolationKind::InferenceDeadline`
# as the time since the last chunk it has not seen before (`crates/es-safety/src/plane.rs`,
# `last_chunk_tick`, spec 9.4). While the runtime replanned on every control tick that gap was
# always zero; once it honours `rate.inference` the gap *is* the re-plan period -- one chunk
# every 10 control ticks, so up to 180 ms between arrivals against a 40 ms number. Measured on
# V15's checkpoint with the old value: the watchdog fired on 7 of every 10 control ticks and
# the fallback held the arm for whole episodes. 12x = 240 ms is the 200 ms the document itself
# asks for plus the 40 ms the old value allowed for the inference. This is the INV-12 move --
# the number a watchdog is measured against moves, the watchdog stays on -- and it is the same
# correction `widen_inference_budget` in `crates/es/tests/cli.rs` already applies to the M2
# fixture for the same reason. `deadlines.observation_age` follows only because spec 9.4
# (`DEP_021`) refuses an `observation_age` below `inference_budget`; the bound that is actually
# enforced is the `stale_observation` watchdog's, unchanged at 80 ms. No safety limit moved and
# `envelope_violation_rate`'s `max_frac` did not move.
#
# `target` is the simulated scene; V3 or a real SO-101 swaps it for `Physical { driver }`
# without touching the envelope.

es_schema = 1
kind = "deployment"

[body]
fallback = "hold_position"
schema_version = 1
watchdogs = [
    { inference_deadline = { budget = 240000 } },
    "chunk_underrun",
    { stale_observation = { max_age = 80000 } },
    { envelope_violation_rate = { max_frac = 0.9, window = 200 } },
]

[body.action]
dim = 6
execute_chunk = 10
horizon = 16
space = "joint_position"

[body.deadlines]
actuation_budget = 10000
inference_budget = 240000
observation_age = 240000

[body.execution.temporal_ensemble]
decay = 0.01

[body.rate.control]
den = 1
num = 50

[body.rate.inference]
den = 1
num = 5

[body.robot]
n_joints = 6
name = "so101"

[body.robot.target.simulated]
scene = "tests/fixtures/mjcf/so101_pick_place.xml"

[body.safety]
acceleration_max = [
    20.0,
    20.0,
    20.0,
    20.0,
    20.0,
    20.0,
]
contact_force_max = 15.0
ee_velocity_max = 0.6
min_env_distance = 0.005
min_self_distance = 0.005
position_soft_margin = [
    0.05,
    0.05,
    0.05,
    0.05,
    0.05,
    0.05,
]
torque_max = [
    2.94,
    2.94,
    2.94,
    2.94,
    2.94,
    2.94,
]
velocity_max = [
    3.0,
    3.0,
    3.0,
    3.0,
    3.0,
    3.0,
]

[body.safety.action_rate]
first_diff_max = [
    0.08,
    0.08,
    0.08,
    0.08,
    0.08,
    0.08,
]
second_diff_max = [
    0.04,
    0.04,
    0.04,
    0.04,
    0.04,
    0.04,
]

[[body.safety.position]]
lower = -1.91986
upper = 1.91986

[[body.safety.position]]
lower = -1.7453293
upper = 1.7453293

[[body.safety.position]]
lower = -1.69
upper = 1.69

[[body.safety.position]]
lower = -1.658063
upper = 1.658063

[[body.safety.position]]
lower = -2.7438473
upper = 2.7438473

[[body.safety.position]]
lower = -0.174533
upper = 1.7453292

[body.safety.workspace.box]
max = [
    0.45,
    0.45,
    0.6,
]
min = [
    -0.45,
    -0.45,
    -0.01,
]

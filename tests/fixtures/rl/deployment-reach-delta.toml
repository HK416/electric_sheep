# Deployment IR + Safety Plane (spec 9) for the SO-101 reach task, driven by **increments**
# -- packet M9/T1, spec 8.5's `ActionSpace::JointDelta`.
#
# THE ENVELOPE IS deployment-reach.toml's, NUMBER FOR NUMBER. Only `action.space` differs, and
# that is the whole point of the document: an increment changes what the *policy* emits, never
# what is safe. `es-env` integrates -- `target_t = target_{t-1} + row_t`, from the plane's last
# executed command and reset at every episode boundary to the pose `observe_state` seeds -- and
# the Safety Plane goes on validating an absolute joint target, so `position`, `velocity_max`,
# `acceleration_max`, `torque_max`, `action_rate` and the workspace box all mean exactly what
# they meant before.
#
# What a delta policy buys is the second-order one: policy noise lands on the increment rather
# than on the target, so the per-tick change the `action_rate.first_diff_max = 0.08` watchdog
# measures is the policy's own output and not the distance between where the arm is and where
# an untrained network guessed. Nothing here widens to pay for it.
#
# The `deployment_hash` is NOT deployment-reach.toml's: same envelope, different execution
# semantics, and spec 5.3 says the hash separates them
# (`cargo test -p es-ir committed_deployment_hashes_are_unmoved_by_joint_delta`).
#
# An `[rl]` trainer or a Learning IR pointed at this document declares its action port in
# `Unit::AngularVelocity` -- rad per control tick, the increment unit -- and `es_ir::cross`
# refuses `Unit::Angle` there by name (XIR-031).

es_schema = 1
kind = "deployment"

[body]
execution = "receding_horizon"
fallback = "hold_position"
schema_version = 1
watchdogs = [
    { inference_deadline = { budget = 240000 } },
    "chunk_underrun",
    { stale_observation = { max_age = 80000 } },
    { envelope_violation_rate = { max_frac = 1.0, window = 200 } },
]

[body.action]
dim = 6
execute_chunk = 1
horizon = 1
space = "joint_delta"

[body.deadlines]
actuation_budget = 10000
inference_budget = 240000
observation_age = 240000

[body.rate.control]
den = 1
num = 50

[body.rate.inference]
den = 1
num = 50

[body.robot]
n_joints = 6
name = "so101"

[body.robot.target.simulated]
scene = "tests/fixtures/mjcf/so101_pick_place.xml"

[body.safety]
acceleration_max = [
    80.0,
    80.0,
    80.0,
    80.0,
    80.0,
    80.0,
]
contact_force_max = 15.0
ee_velocity_max = 0.6
min_env_distance = 0.005
min_self_distance = 0.005
position_soft_margin = [
    0.05,
    0.05,
    0.05,
    0.05,
    0.05,
    0.05,
]
torque_max = [
    2.94,
    2.94,
    2.94,
    2.94,
    2.94,
    2.94,
]
velocity_max = [
    3.0,
    3.0,
    3.0,
    3.0,
    3.0,
    3.0,
]

[body.safety.action_rate]
first_diff_max = [
    0.08,
    0.08,
    0.08,
    0.08,
    0.08,
    0.08,
]
second_diff_max = [
    0.04,
    0.04,
    0.04,
    0.04,
    0.04,
    0.04,
]

[[body.safety.position]]
lower = -1.91986
upper = 1.91986

[[body.safety.position]]
lower = -1.7453293
upper = 1.7453293

[[body.safety.position]]
lower = -1.69
upper = 1.69

[[body.safety.position]]
lower = -1.658063
upper = 1.658063

[[body.safety.position]]
lower = -2.7438473
upper = 2.7438473

[[body.safety.position]]
lower = -0.174533
upper = 1.7453292

[body.safety.workspace.box]
max = [
    0.45,
    0.45,
    0.6,
]
min = [
    -0.45,
    -0.45,
    -0.01,
]

# Evaluation IR (spec 10) for the SO-101 reach task with the previous action observed --
# packet M11/I3.
#
# Generated by `ES_GENERATE_GOLDENS=1 cargo test -p es --test cli -- --ignored
# regenerate_isaac_so101_documents`. `evaluation-reach.toml` with `task` and `observation`
# following the documents an Isaac Lab reach policy is imported against, and nothing else:
# the same 16 held-out seeds 201-216, the same four suites, the same `success_rate >= 0.8`
# on `nominal` -- so an Isaac row and an A0 row (scored by `evaluation-reach.toml`) are asked
# the same question.
#
#  * `task` is `task-reach-last-action.toml`'s hash.
#  * `observation` is the Observation IR `es policy import-rl` writes for
#    `adapter-isaac-so101.toml`. The Isaac policies train without empirical normalization
#    (Isaac Lab's own reach runner config), so that document is a function of the adapter
#    alone -- the offset and scale folded into `Normalize{MeanStd}` -- and every seed's import
#    carries this one hash (`XIR-040` refuses a bundle that does not).


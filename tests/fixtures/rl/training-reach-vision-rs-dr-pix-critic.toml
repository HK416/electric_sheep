# Packet M11/R10 arm P: X7's `rs-dr-pix` recipe (training-reach-vision-rs-dr-pix.toml) with the
# value network reading privileged simulator state -- `[rl] critic = "privileged"`: every
# non-image observation port and `Rollout.qpos`, which carries the cube's free joint. The actor,
# the bundle, the PPO block and the budget are X7's, unchanged. The critic is training-only and
# never reaches the bundle (docs/design/rl-continuation.md rule 1; section 7, R10). Seeds 1 and 2
# are this file with `[run] seed` changed.
#
# The bundle is X7's `rs-dr-pix` bundle:
#
#     ES_PACK_TASK=tests/fixtures/rl/task-reach-vision-rs-dr.toml \
#     ES_PACK_OBSERVATION=tests/fixtures/rl/observation-reach-vision-rs-dr-pix.toml \
#     ES_PACK_LEARNING=tests/fixtures/rl/learning-reach-vision-pix.toml \
#     ES_PACK_DEPLOYMENT=tests/fixtures/rl/deployment-reach.toml \
#     ES_PACK_OUT=runs/reach-vision-rs-dr-pix/untrained.esb \
#     cargo test -p es --test cli -- --ignored pack_untrained_bundle

kind = "training"

[policy]
bundle = "runs/reach-vision-rs-dr-pix/untrained.esb"

[rl]
algo        = "ppo"
envs        = 16
horizon     = 64
epochs      = 4
minibatches = 4
gamma       = 0.99
lam         = 0.95
clip        = 0.2
entropy     = 0.005
value_coef  = 0.5
critic      = "privileged"

[run]
steps         = 4000
lr            = 3e-4
seed          = 0
checkpoint_at = [1000, 2000, 3000]
device        = "cuda"
interpreter   = "python"

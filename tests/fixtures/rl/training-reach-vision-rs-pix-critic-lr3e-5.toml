# Packet M11/R11 arm A2: R10's arm-P recipe (training-reach-vision-rs-pix-critic.toml) with
# `[run] lr = 3e-5` and nothing else changed (docs/packets/M11/P-M11-R11-first-update-saturation.md;
# docs/design/rl-continuation.md section 7, R11). Stage A runs it at `steps = 20` with
# `checkpoint_at = [1, 5, 20]`; the server script rewrites `steps`, `checkpoint_at` and the bundle
# path per stage, as R10's did.
#
# The bundle is X7's `rs-pix` bundle:
#
#     ES_PACK_TASK=tests/fixtures/rl/task-reach-vision-rs.toml \
#     ES_PACK_OBSERVATION=tests/fixtures/rl/observation-reach-vision-rs-pix.toml \
#     ES_PACK_LEARNING=tests/fixtures/rl/learning-reach-vision-pix.toml \
#     ES_PACK_DEPLOYMENT=tests/fixtures/rl/deployment-reach.toml \
#     ES_PACK_OUT=runs/reach-vision-rs-pix/untrained.esb \
#     cargo test -p es --test cli -- --ignored pack_untrained_bundle

kind = "training"

[policy]
bundle = "runs/reach-vision-rs-pix/untrained.esb"

[rl]
algo        = "ppo"
envs        = 16
horizon     = 64
epochs      = 4
minibatches = 4
gamma       = 0.99
lam         = 0.95
clip        = 0.2
entropy     = 0.005
value_coef  = 0.5
critic      = "privileged"

[run]
steps         = 4000
lr            = 3e-5
seed          = 0
checkpoint_at = [1000, 2000, 3000]
device        = "cuda"
interpreter   = "python"

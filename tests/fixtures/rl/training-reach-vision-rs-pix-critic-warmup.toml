# Packet M11/R11 arm AW: R10's arm-P recipe (training-reach-vision-rs-pix-critic.toml) with
# `[run] schedule = { kind = "warmup_cosine", warmup = 100, lr_min = 0.0 }` and nothing else
# changed (docs/packets/M11/P-M11-R11-first-update-saturation.md; docs/design/rl-continuation.md
# section 7, R11). The server script rewrites `steps`, `checkpoint_at` and the bundle path per
# stage, as R10's did.
#
# `warmup` counts what the trainer counts. `train_ppo.py` evaluates the schedule once per PPO
# iteration (`lr_at(iteration, iterations, ...)`), and all 4 epochs x 4 minibatches = 16 Adam
# steps of that iteration use the value. So `warmup = 100` is 100 iterations, which is 1,600
# optimizer steps; `warmup = 1600` would be 1,600 iterations. `es train` refuses
# `warmup >= steps`, so stage A runs this file at `steps = 101` and reads iterations 1-20: on the
# ramp the rate is 3e-4 * iteration / 100 whatever the run's length.
#
# The bundle is X7's `rs-pix` bundle:
#
#     ES_PACK_TASK=tests/fixtures/rl/task-reach-vision-rs.toml \
#     ES_PACK_OBSERVATION=tests/fixtures/rl/observation-reach-vision-rs-pix.toml \
#     ES_PACK_LEARNING=tests/fixtures/rl/learning-reach-vision-pix.toml \
#     ES_PACK_DEPLOYMENT=tests/fixtures/rl/deployment-reach.toml \
#     ES_PACK_OUT=runs/reach-vision-rs-pix/untrained.esb \
#     cargo test -p es --test cli -- --ignored pack_untrained_bundle

kind = "training"

[policy]
bundle = "runs/reach-vision-rs-pix/untrained.esb"

[rl]
algo        = "ppo"
envs        = 16
horizon     = 64
epochs      = 4
minibatches = 4
gamma       = 0.99
lam         = 0.95
clip        = 0.2
entropy     = 0.005
value_coef  = 0.5
critic      = "privileged"

[run]
steps         = 4000
lr            = 3e-4
schedule      = { kind = "warmup_cosine", warmup = 100, lr_min = 0.0 }
seed          = 0
checkpoint_at = [1000, 2000, 3000]
device        = "cuda"
interpreter   = "python"

# Evaluation IR (spec 10) for the camera-bearing SO-101 reach task -- packet M11/X3.
#
# evaluation-reach.toml with `task` and `observation` following the vision documents' hashes
# and nothing else: the same 16 held-out seeds 201-216, the same suites, the same
# `success_rate >= 0.8` on `nominal`. Generated by `regenerate_vision_reach_documents`.

es_schema = 1
kind = "evaluation"

[body]
augmentation = "disabled"
metrics = [
    "success_rate",
    "episode_length",
    "envelope_violation_rate",
    "failure_mode_histogram",
]
observation = "5d85820b663d5ddb5d540a3f0064882ccce8e0df4702040bc618714869898aa0"
replay = "failures_first"
schema_version = 1
task = "421b588bb7a15996362663b02c6b697041dcf020bf0d0da715b03c17da300a97"

[[body.acceptance]]
aggregation = "mean"
comparator = "ge"
metric = "success_rate"
suite = "nominal"
threshold = 0.8

[body.episodes]
n_episodes = 16

[body.episodes.seeds]
explicit = [
    201,
    202,
    203,
    204,
    205,
    206,
    207,
    208,
    209,
    210,
    211,
    212,
    213,
    214,
    215,
    216,
]

[[body.suites]]
name = "nominal"
perturbations = []

[[body.suites]]
name = "observation_delay"

[[body.suites.perturbations]]
stream = 2

[body.suites.perturbations.kind.observation_delay]
ms = [
    20,
    40,
]

[[body.suites]]
name = "torque_noise"

[[body.suites.perturbations]]
stream = 3

[body.suites.perturbations.kind.torque_noise]
rel_sigma = 0.05

[[body.suites]]
name = "backlash"

[[body.suites.perturbations]]
stream = 4

[body.suites.perturbations.kind.backlash.rad]
hi = 0.01
lo = 0.0

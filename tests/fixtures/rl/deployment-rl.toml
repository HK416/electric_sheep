# Deployment IR + Safety Plane (spec 9) for the demo task under PPO -- packet M8/S4b.
#
# `tests/fixtures/visible-learning/deployment.toml` with four fields moved, and nothing else.
# Every safety limit -- position, velocity, acceleration, torque, the action-rate backstop,
# the soft margin, the workspace box -- is the demo's own number, unchanged. The plane is on
# for every sampled action of every rollout, and no flag anywhere can turn it off (INV-12).
#
# What moved, and why:
#
#  * `action.horizon = 1`, `action.execute_chunk = 1` and `execution = "receding_horizon"`.
#    PPO acts on every control tick (`docs/design/rl-continuation.md` section 3): the chunk
#    handed to the plane carries exactly one row under a fresh `seq`, so there is no chunk
#    buffer, nothing to ensemble and no declared latency. `TemporalEnsemble` is a blend of
#    overlapping predictions and there are none at horizon 1, so declaring it would name a
#    behaviour the run does not have. `(6, 1)` is already a row of `es_native.Rollout`'s
#    const-generic table (crates/es-py/src/pybind.rs).
#  * `rate.inference = 50 Hz`, the control rate. The demo replans at 5 Hz because ACT executes
#    ten rows of a sixteen-row chunk; a horizon-1 policy produces one row per control tick by
#    definition, and a document that declared 5 Hz here would be describing a chunk that does
#    not exist. The `inference_deadline` watchdog therefore sees a fresh chunk every tick
#    against a 240 ms budget, which is the 12x the demo already declares.
#  * `envelope_violation_rate.max_frac = 1.0`, was 0.9. **This is the INV-12 move -- the
#    number a watchdog is measured against moves, the watchdog stays on** -- and it is the
#    same correction the demo's own header describes making at V0 (0.05 -> 0.9) for the same
#    reason. A PPO run starts from a Gaussian around an untrained network's output: the first
#    iterations command poses the arm is nowhere near, so the plane clamps on very nearly
#    every tick by construction, not by anomaly. At 0.9 the watchdog latches the fallback in
#    the first seconds of iteration 0 and every later iteration trains on an arm that is being
#    held rather than driven -- the policy would be optimizing against the fallback, not
#    against itself. Every clamp is still counted, still returned in `EventSet::bits()` and
#    still reported per iteration as `envelope_violation_rate` and `executed_ne_sampled_rate`
#    in `metrics/loss-curve.json`, so what the plane did is measured rather than hidden.
#    Widening the envelope is the sanctioned move; disabling the plane is not.
#
# Nothing here is RL-specific beyond those four fields: the same document evaluates the
# trained policy through `es eval run`, which is what keeps that number the evaluation's and
# not the trainer's.

es_schema = 1
kind = "deployment"

[body]
execution = "receding_horizon"
fallback = "hold_position"
schema_version = 1
watchdogs = [
    { inference_deadline = { budget = 240000 } },
    "chunk_underrun",
    { stale_observation = { max_age = 80000 } },
    { envelope_violation_rate = { max_frac = 1.0, window = 200 } },
]

[body.action]
dim = 6
execute_chunk = 1
horizon = 1
space = "joint_position"

[body.deadlines]
actuation_budget = 10000
inference_budget = 240000
observation_age = 240000

[body.rate.control]
den = 1
num = 50

[body.rate.inference]
den = 1
num = 50

[body.robot]
n_joints = 6
name = "so101"

[body.robot.target.simulated]
scene = "tests/fixtures/mjcf/so101_pick_place.xml"

[body.safety]
acceleration_max = [
    80.0,
    80.0,
    80.0,
    80.0,
    80.0,
    80.0,
]
contact_force_max = 15.0
ee_velocity_max = 0.6
min_env_distance = 0.005
min_self_distance = 0.005
position_soft_margin = [
    0.05,
    0.05,
    0.05,
    0.05,
    0.05,
    0.05,
]
torque_max = [
    2.94,
    2.94,
    2.94,
    2.94,
    2.94,
    2.94,
]
velocity_max = [
    3.0,
    3.0,
    3.0,
    3.0,
    3.0,
    3.0,
]

[body.safety.action_rate]
first_diff_max = [
    0.08,
    0.08,
    0.08,
    0.08,
    0.08,
    0.08,
]
second_diff_max = [
    0.04,
    0.04,
    0.04,
    0.04,
    0.04,
    0.04,
]

[[body.safety.position]]
lower = -1.91986
upper = 1.91986

[[body.safety.position]]
lower = -1.7453293
upper = 1.7453293

[[body.safety.position]]
lower = -1.69
upper = 1.69

[[body.safety.position]]
lower = -1.658063
upper = 1.658063

[[body.safety.position]]
lower = -2.7438473
upper = 2.7438473

[[body.safety.position]]
lower = -0.174533
upper = 1.7453292

[body.safety.workspace.box]
max = [
    0.45,
    0.45,
    0.6,
]
min = [
    -0.45,
    -0.45,
    -0.01,
]

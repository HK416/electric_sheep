# Evaluation IR (spec 10) for the Shadow Hand student, nominal suite only -- plan H, packet
# M16/H3b.
#
# Generated by `ES_GENERATE_GOLDENS=1 cargo test -p es --test shadow_hand -- --ignored generate_shadow_hand_documents` (crates/es/tests/shadow_hand.rs);
# evaluation-student.toml with only its `nominal` suite: the same `task` and `observation`, the
# same 64 held-out seeds 301-364, the same metrics and (placeholder) acceptance. Rendering 64
# episodes x six suites of three 32-spp cameras is about 14 h on the local PC, so
# cycle-student.toml judges nominal first (a sixth of that); evaluation-student.toml, all six
# suites, stays for a later run on the checkpoint the cycle trains (cycle-student.toml's header
# has the command).


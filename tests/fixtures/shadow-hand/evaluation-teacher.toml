# Evaluation IR (spec 10) for the Shadow Hand teacher -- plan H, packet M16/H2.
#
# Generated by `ES_GENERATE_GOLDENS=1 cargo test -p es --test shadow_hand -- --ignored generate_shadow_hand_documents` (crates/es/tests/shadow_hand.rs)
# from evaluation-reach.toml: `task` and `observation` are task-repose.toml's and
# observation-teacher.toml's hashes; the nominal suite only; 16 held-out seeds 301-316; metrics
# success_rate, episode_length, envelope_violation_rate, failure_mode_histogram. Run it with
# `--backend mujoco-cpu` (the reference) whatever backend trained the policy.
#
# ACCEPTANCE IS A PLACEHOLDER (success_rate >= 0.5 on nominal): the orchestrator sets it from
# E1's stop rule before the run.

es_schema = 1
kind = "evaluation"

[body]
augmentation = "disabled"
metrics = [
    "success_rate",
    "episode_length",
    "envelope_violation_rate",
    "failure_mode_histogram",
]
observation = "3d81f87b0aaacf01dd1e8171580ded31c8e20024aab25b9bd853690910623dd1"
replay = "failures_first"
schema_version = 1
task = "a2c25e34b3f3eac11372d3ab5ae3fbbdb72657e981a56a43635971f530305146"

[[body.acceptance]]
aggregation = "mean"
comparator = "ge"
metric = "success_rate"
suite = "nominal"
threshold = 0.5

[body.episodes]
n_episodes = 16

[body.episodes.seeds]
explicit = [
    301,
    302,
    303,
    304,
    305,
    306,
    307,
    308,
    309,
    310,

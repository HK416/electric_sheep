schema_version = 1
task = "9fd6c6db61edfa2ca8018a3b91d9998377e22d7e40d11380fa0f6b2917ef001e"

[[body.acceptance]]
aggregation = "mean"
comparator = "ge"
metric = "success_rate"
suite = "nominal"
